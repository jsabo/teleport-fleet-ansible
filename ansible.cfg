[defaults]
# No default inventory: pass yours with -i (any format, any location).
roles_path = roles
forks = 30
# Fresh VMs churn host keys. The Teleport phase still checks host identity through
# the proxy (tsh's own known_hosts in the generated ssh config).
host_key_checking = False
interpreter_python = auto_silent
callbacks_enabled = ansible.posix.profile_tasks, ansible.posix.timer
result_format = yaml
retry_files_enabled = False
display_skipped_hosts = False

[ssh_connection]
# One SSH round trip per task instead of three (mkdir, put, exec). Through the
# Teleport proxy each round trip also spawns a `tsh proxy ssh` process, so this
# is the single biggest speed lever for the verify and harden phases.
pipelining = True
# Reuse one connection per host across tasks and across the pauses of a narrated
# demo. Do NOT add -o ControlPath here: Ansible sets it per host. Do NOT add -F
# here: vars/transport-*.yml own it so the same config serves both transports.
ssh_args = -C -o ControlMaster=auto -o ControlPersist=600s -o ServerAliveInterval=30
