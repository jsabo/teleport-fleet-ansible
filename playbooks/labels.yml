---
# Reclassify hosts through Teleport: change classification labels (lifecycle, plus any
# you add, such as team) and reload the agent. To move a host between environments
# (env), re-enroll it instead.
#
#   ansible-playbook playbooks/labels.yml --limit web-01 \
#     -e '{"teleport_class_labels":{"lifecycle":"active","team":"payments"}}'
- import_playbook: _teleport-transport.yml

- name: Reclassify (Teleport transport)
  hosts: "{{ target | default('nodes') }}"
  vars_files:
    - ../vars/transport-teleport.yml
  gather_facts: false
  become: true
  tasks:
    - name: Detect join state
      ansible.builtin.import_role:
        name: teleport_node
        tasks_from: needs_join

    - name: Write the configuration (reload on change)
      ansible.builtin.import_role:
        name: teleport_node
        tasks_from: configure
