---
# Teleport transport: used once a host is enrolled (verify, harden, labels, the
# first half of unenroll). Ansible connects to <nodename>.<cluster> and the ssh
# config written by playbooks/_teleport-transport.yml (from `tsh config`, or tbot's
# ssh_config output for a bot) supplies Port 3022 and the ProxyCommand. No private
# key: the certificate named in that config is the credential.
# Right after an enrolment the node's UUID is known (teleport_host_uuid) and is used
# instead of the name: a UUID is unique even while the cluster still lists a record of
# an earlier host that carried the same name. Later runs use the name.
ansible_host: "{{ teleport_host_uuid | default(teleport_nodename | default(inventory_hostname)) }}.{{ teleport_cluster_name }}"
ansible_user: "{{ teleport_ssh_login }}"
ansible_ssh_private_key_file: ""
# teleport_ssh_config_path is a fact set by playbooks/_teleport-transport.yml, so the
# path holds wherever the playbook or the inventory lives. IdentitiesOnly makes ssh
# offer only the certificate named in that config; without it every key in the agent
# is tried first and the proxy disconnects after too many failures.
ansible_ssh_common_args: >-
  -F {{ teleport_ssh_config_path }}
  -o IdentitiesOnly=yes
