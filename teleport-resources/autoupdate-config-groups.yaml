# Managed Updates groups, so `teleport_update_group: staging | production` means
# something. Apply once:
#   tctl create -f teleport-resources/autoupdate-config-groups.yaml
#
# Facts that matter:
#   - the group is a string the agent sends (`teleport-update enable --group`); an
#     unknown name (including the default `default`) falls back to the LAST group
#     listed here, so `production` is the catch-all
#   - halt-on-error updates groups in order and stops if one fails; canary_count
#     updates that many agents first
#   - start_hour is UTC; the hours below match this tenant's existing maintenance
#     window (cluster_maintenance_config: Mon–Thu 08:00 UTC)
#   - Teleport Enterprise (Cloud) manages autoupdate_version; self-hosted clusters
#     must also create autoupdate_version or agents never update
kind: autoupdate_config
version: v1
metadata:
  name: autoupdate-config
spec:
  tools:
    mode: enabled
  agents:
    mode: enabled
    strategy: halt-on-error
    schedules:
      regular:
        - name: staging
          days: ["Mon", "Tue", "Wed", "Thu"]
          start_hour: 8
          canary_count: 1
        - name: production
          days: ["Mon", "Tue", "Wed", "Thu"]
          start_hour: 9
          wait_hours: 24
