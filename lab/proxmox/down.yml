---
# Remove the lab fleet: stop the agents, destroy the VMs, remove their node records,
# drop the generated inventory. The downloaded cloud images stay on the Proxmox
# datastore so the next up.yml does not fetch them again (-e lab_keep_images=false
# removes them too).
#   ansible-playbook -i inventory/lab.yml lab/proxmox/down.yml
#
# The agents are stopped first, and the VMs are destroyed only once Teleport can no
# longer reach them. A node record outlives its agent by up to 15 minutes, and while
# the Auth Service still holds the agent's control stream it re-creates a record that
# `tctl rm` deleted (measured: about four minutes after a VM is killed with the agent
# still connected; immediately closed when the agent exits on its own). A stale record
# with the same name would make `tsh ssh <name>` ambiguous for the next fleet. Hosts
# that cannot be reached (a fleet that never enrolled) are skipped.
- import_playbook: ../../playbooks/_teleport-transport.yml

- name: Stop the agents (Teleport transport)
  hosts: nodes
  vars_files:
    - ../../vars/transport-teleport.yml
  gather_facts: false
  become: true
  ignore_unreachable: true
  tasks:
    # This session runs through the very agent being stopped, so the stop is scheduled
    # a few seconds ahead with a transient systemd timer and the session ends cleanly.
    - name: Schedule the agent to stop in 5 seconds
      ansible.builtin.command: systemd-run --on-active=5 --unit=lab-teleport-stop systemctl stop teleport
      changed_when: true
      failed_when: false

    # Drop Ansible's persistent connection so nothing of ours is left open through
    # the agent while it shuts down.
    - name: Close this connection
      ansible.builtin.meta: reset_connection

    # `tsh ssh` succeeds while the agent is up and fails once the proxy has lost it. The
    # result is checked before anything is destroyed (first task of the next play), so a
    # host that is still reachable at the end stops the run rather than lose its VM.
    # How long that takes varies a lot: measured on Teleport Cloud 18.11.7 across four
    # teardowns of six hosts, from 1 attempt to more than 15 (each attempt about 3 s).
    # 40 attempts, about two minutes, covers what was seen with margin.
    - name: Wait until Teleport can no longer reach the host
      ansible.builtin.command: tsh ssh {{ teleport_ssh_login }}@{{ inventory_hostname }} true
      delegate_to: localhost
      become: false
      register: lab_probe
      changed_when: false
      failed_when: false
      retries: 40
      delay: 2
      until: lab_probe.rc != 0

- name: Destroy the lab VMs
  hosts: localhost
  gather_facts: false
  vars_files:
    - vars.yml
  tasks:
    # The gate. A failed task in the play above would not stop this play, which runs on
    # localhost, so the probe results are checked here instead.
    - name: Refuse to destroy a VM whose agent is still connected
      ansible.builtin.assert:
        that: lab_still_connected | length == 0
        fail_msg: >-
          Teleport could still reach {{ lab_still_connected | join(', ') }} after the stop.
          Nothing was destroyed; run down.yml again once the agent has exited.
      vars:
        lab_still_connected: >-
          {{ groups['nodes'] | default([]) | map('extract', hostvars) | selectattr('lab_probe', 'defined')
             | selectattr('lab_probe.rc', 'equalto', 0) | map(attribute='inventory_hostname') | list }}

    # Read before the destroy empties the state. Works with or without -i, unlike the
    # inventory, so reset.yml cleans up the same way down.yml does.
    - name: Read the lab VMs' names from the Terraform state
      ansible.builtin.command: terraform -chdir={{ playbook_dir }} output -json vms
      register: lab_vms_out
      changed_when: false
      failed_when: false

    - name: Record the node names
      ansible.builtin.set_fact:
        lab_node_names: >-
          {{ (lab_vms_out.stdout | from_json | dict2items | selectattr('value.role', 'equalto', 'node')
              | map(attribute='key') | list) if lab_vms_out.rc == 0 else [] }}

    - name: Destroy the VMs
      community.general.terraform:
        project_path: "{{ playbook_dir }}"
        state: absent
        targets: "{{ ['proxmox_virtual_environment_vm.vm'] if lab_keep_images | default(true) | bool else omit }}"
        complex_vars: true
        variables:
          proxmox_endpoint: "{{ proxmox_endpoint }}"
          proxmox_api_token: "{{ proxmox_api_token }}"
          proxmox_node: "{{ proxmox_node }}"
          ssh_public_key: "{{ lookup('file', ssh_public_key_file | expanduser) | trim }}"
          mirror_enabled: "{{ lab_mirror | default(false) | bool }}"
      no_log: true

    - name: Read what is left in the Terraform state
      ansible.builtin.command: terraform -chdir={{ playbook_dir }} state list
      register: lab_state
      changed_when: false

    - name: Assert only the images remain
      ansible.builtin.assert:
        that: lab_state.stdout_lines | reject('match', '^proxmox_download_file\\.') | list | length == 0
        fail_msg: "Terraform state still lists: {{ lab_state.stdout_lines }}"

    - name: Remove the lab's node records
      ansible.builtin.include_tasks: tasks/remove-node-records.yml
      loop: [1, 2, 3, 4, 5, 6]
      loop_control:
        loop_var: lab_attempt

    - name: Drop the generated inventory
      ansible.builtin.file:
        path: "{{ playbook_dir }}/../../inventory/lab.yml"
        state: absent
